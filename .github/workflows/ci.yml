name: Validate distribution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev,cloud]"
      - run: python scripts/build_viewer.py
      - run: python -m ruff check src tests scripts
      - run: python -m pyright
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/smoke_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}
          path: dist/*
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t seqatelier-test .
      - name: Start a synthetic cloud instance
        run: >-
          docker run -d --name seqatelier-test -p 10000:10000
          -e SEQATELIER_AUTH_ISSUER=https://login.example/
          -e SEQATELIER_AUTH_CLIENT_ID=synthetic-client
          -e 'SEQATELIER_AUTH_SUBJECTS=github|1234'
          -e SEQATELIER_PUBLIC_URL=https://localhost:10000
          seqatelier-test
      - name: Check health and authentication boundary
        run: |
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://localhost:10000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/plasmids)" = 401
      - if: always()
        run: docker rm -f seqatelier-test
