name: Publish preview release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-preview
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev,cloud]"
      - run: python scripts/build_viewer.py
      - run: python -m ruff check src tests scripts
      - run: python -m pyright
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/smoke_wheel.py
      - name: Prepare release metadata
        id: metadata
        run: python scripts/release_metadata.py
      - name: Publish a new preview without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
          --target "$RELEASE_COMMIT" --title "SeqAtelier $RELEASE_TAG"
          --prerelease --notes-file docs/release-notes.md
